<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friend Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Keep track of your daily spending</p>
        </header>


        <!-- Summary -->

        <section class="summary">

            <div class="summary-card">
                <h3>Total Spent</h3>
                <p id="totalAmount">Rs. 0</p>
            </div>

            <div class="summary-card">
                <h3>Expenses</h3>
                <p id="expenseCount">0</p>
            </div>

        </section>


        <!-- Add Expense -->

        <section class="expense-form">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="input-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Lunch"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="amount">
                        Amount (Rs.)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 500"
                        min="1"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Transport">
                            🚌 Transport
                        </option>

                        <option value="Shopping">
                            🛍️ Shopping
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Add Expense
                </button>

            </form>

        </section>


        <!-- Expense List -->

        <section class="expenses">

            <h2>Recent Expenses</h2>

            <div id="expenseList">

                <p id="emptyMessage">
                    No expenses yet.
                </p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
